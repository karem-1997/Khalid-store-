<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khalid Store | النظام المطور</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root { --main: #ff8c00; --dark: #0a0a0c; --card: #16161a; }
        body { font-family: 'Cairo', sans-serif; background: var(--dark); color: white; margin: 0; padding-bottom: 60px; }
        
        header { text-align: center; padding: 30px 10px; background: #000; border-bottom: 3px solid var(--main); background-size: cover; background-position: center; }
        
        /* شبكة المنتجات - 2 في كل صف */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
        .card { background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid #222; display: flex; flex-direction: column; }
        .card-img { width: 100%; aspect-ratio: 1/1; object-fit: contain; background: #000; cursor: pointer; }

        /* لوحة التحكم الشاملة (تصميم الكود الأساسي) */
        #adminPanel { display: none; position: fixed; inset: 0; background: #f0f0f0; color: #333; z-index: 10000; overflow-y: auto; padding: 20px; }
        .admin-box { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; border-right: 5px solid var(--main); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .inp { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: 'Cairo'; }
        
        /* زر أدمن الصغير في الأسفل */
        .admin-btn { position: fixed; bottom: 10px; left: 10px; font-size: 10px; opacity: 0.3; color: #fff; background: none; border: none; cursor: pointer; z-index: 9999; }

        /* المودال وعارض الصور */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 5000; overflow-y: auto; padding: 10px; }
        .modal-content { background: #fff; color: #333; padding: 20px; border-radius: 20px; max-width: 500px; margin: auto; }
        
        .viewer-box { position: relative; width: 100%; text-align: center; margin-bottom: 15px; }
        .viewer-box img { width: 100%; max-height: 400px; object-fit: contain; }
        .v-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; border: none; padding: 10px; border-radius: 50%; cursor: pointer; }

        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 5px; font-family: 'Cairo'; }
        .btn-main { background: var(--main); color: white; }
        
        .order-row { background: #eee; padding: 10px; margin-bottom: 5px; border-radius: 8px; font-size: 0.9rem; }
    </style>
</head>
<body id="mainBody">

<header id="mainHeader"><h1 id="shopName">Khalid Store</h1></header>

<div id="storeGrid" class="grid"></div>

<button class="admin-btn" onclick="openAdmin()">Admin</button>

<div id="adminPanel">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2>🛠 لوحة التحكم الشاملة</h2>
        <button onclick="document.getElementById('adminPanel').style.display='none'" style="background:red; color:white; border:none; padding:10px; border-radius:8px;">إغلاق</button>
    </div>

    <div class="admin-box">
        <h3>🎨 إعدادات المظهر والهوية</h3>
        <input type="text" id="setT" class="inp" placeholder="اسم المتجر">
        <input type="text" id="setW" class="inp" placeholder="رقم واتساب الطلبات">
        <label>صورة الغلاف (Header):</label><input type="file" class="inp" onchange="encodeCover('header')">
        <label>خلفية المتجر (Body):</label><input type="file" class="inp" onchange="encodeCover('body')">
        <input type="text" id="setPass" class="inp" placeholder="تغيير كلمة المرور">
        <button class="btn btn-main" onclick="saveSets()">حفظ الإعدادات</button>
    </div>

    <div class="admin-box">
        <h3>📦 إضافة منتج جديد (صور متعددة)</h3>
        <input type="text" id="pN" class="inp" placeholder="اسم المنتج">
        <input type="text" id="pC" class="inp" placeholder="كود المنتج (Code)">
        <input type="number" id="pP" class="inp" placeholder="السعر">
        <textarea id="pD" class="inp" placeholder="وصف المنتج"></textarea>
        <label>اختر الصور (يمكنك تحديد أكثر من صورة):</label>
        <input type="file" id="pI" class="inp" multiple onchange="encodeMultiImgs()">
        <div id="previews" style="display:flex; gap:5px; margin-top:10px;"></div>
        <button class="btn btn-main" onclick="addProduct()">إضافة المنتج للمتجر</button>
    </div>

    <div class="admin-box"><h3>📥 الطلبات الجديدة</h3><div id="listOrders"></div></div>
    
    <div class="admin-box"><h3>✅ الأرشيف</h3><div id="listArchive"></div></div>

    <div class="admin-box"><h3>🗒 المنتجات الحالية</h3><div id="listProds"></div></div>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <div class="viewer-box">
            <button class="v-nav" style="right:0;" onclick="moveV(1)">❮</button>
            <img id="vImg" src="">
            <button class="v-nav" style="left:0;" onclick="moveV(-1)">❯</button>
        </div>
        <div id="orderForm">
            <h3 id="targetN" style="text-align:center; margin:0;"></h3>
            <p id="targetC" style="text-align:center; font-size:0.8rem; color:#666;"></p>
            <input type="text" id="cuN" class="inp" placeholder="اسم العميل">
            <input type="text" id="cuP" class="inp" placeholder="رقم الهاتف">
            <input type="number" id="cuQ" class="inp" value="1">
            <button class="btn btn-main" onclick="confirmOrder()">تأكيد وإصدار فاتورة</button>
        </div>
        <div id="invoiceSection" style="display:none;">
            <div id="invoiceBox" style="background:#fff; color:#000; padding:15px; border:1px solid #000; direction:ltr; font-family:Arial;">
                <h2 id="invShop" style="text-align:center; margin:0;"></h2>
                <hr>
                <p>Order: #<span id="invSer"></span></p>
                <p>Item: <span id="invItem"></span></p>
                <p>Price: <span id="invPrice"></span> AED</p>
                <p>Qty: <span id="invQty"></span></p>
                <hr>
                <h3 style="text-align:right;">TOTAL: <span id="invTotal"></span> AED</h3>
            </div>
            <button class="btn btn-main" onclick="downloadInv()">تحميل كصورة 📥</button>
            <button class="btn" style="background:#25d366; color:white;" onclick="sendWA()">واتساب 💬</button>
        </div>
        <button class="btn" style="background:#ccc; margin-top:10px;" onclick="closeModal()">إغلاق</button>
    </div>
</div>

<script>
    // بيانات Firebase الخاصة بك
    const firebaseConfig = {
        apiKey: "AIzaSyD6nEUwZKumRxmYUdqiJISTYsKcy5j_ISM",
        authDomain: "khalid-store-86442.firebaseapp.com",
        databaseURL: "https://khalid-store-86442-default-rtdb.firebaseio.com",
        projectId: "khalid-store-86442",
        storageBucket: "khalid-store-86442.firebasestorage.app",
        messagingSenderId: "857306041339",
        appId: "1:857306041339:web:b5b38da9563fde210d595e"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let sets = {}, tempImages = [], tempHeader = "", tempBody = "", activeP = null, vIdx = 0, currentOrder = null;

    // جلب الإعدادات والمنتجات والطلبات
    db.ref('settings').on('value', s => {
        sets = s.val() || { title: "Khalid Store", wa: "966", pass: "123", lastSerial: 1000 };
        document.getElementById('shopName').innerText = sets.title;
        if(sets.hB) document.getElementById('mainHeader').style.backgroundImage = `url('${sets.hB}')`;
        if(sets.bB) document.getElementById('mainBody').style.backgroundImage = `url('${sets.bB}')`;
        document.getElementById('setT').value = sets.title;
        document.getElementById('setW').value = sets.wa;
        document.getElementById('setPass').value = sets.pass;
    });

    db.ref('items').on('value', s => {
        const grid = document.getElementById('storeGrid');
        const list = document.getElementById('listProds');
        grid.innerHTML = ''; list.innerHTML = '';
        const data = s.val();
        if(data) Object.keys(data).forEach(k => {
            const i = data[k]; const imgs = i.images || [i.img];
            grid.innerHTML += `<div class="card" onclick="openOrder('${k}')"><img src="${imgs[0]}" class="card-img"><div style="padding:8px; text-align:center;"><b>${i.name}</b><br><span style="color:var(--main)">${i.price} AED</span></div></div>`;
            list.innerHTML += `<div class="order-row" style="display:flex; justify-content:space-between; align-items:center;"><span>${i.name}</span><button onclick="db.ref('items/${k}').remove()" style="color:red; background:none; border:none;">حذف</button></div>`;
        });
    });

    db.ref('orders').on('value', s => {
        const l = document.getElementById('listOrders'); const a = document.getElementById('listArchive');
        l.innerHTML = ''; a.innerHTML = ''; const data = s.val();
        if(data) Object.keys(data).forEach(k => {
            const o = data[k];
            const html = `<div class="order-row"><b>#${o.serial} - ${o.customer}</b><br>${o.name} - ${o.total} AED<br><button onclick="db.ref('orders/${k}').update({status:'archived'})">نقل للأرشيف</button></div>`;
            if(o.status === 'new') l.innerHTML += html; else a.innerHTML += html;
        });
    });

    // ميديا
    function encodeMultiImgs() {
        const files = event.target.files; tempImages = []; document.getElementById('previews').innerHTML = '';
        Array.from(files).slice(0, 6).forEach(f => {
            const r = new FileReader(); r.onloadend = () => { tempImages.push(r.result); document.getElementById('previews').innerHTML += `<img src="${r.result}" style="width:30px; height:30px; border-radius:4px;">`; }; r.readAsDataURL(f);
        });
    }

    function encodeCover(t) {
        const f = event.target.files[0]; const r = new FileReader();
        r.onloadend = () => { if(t==='header') tempHeader = r.result; else tempBody = r.result; }; r.readAsDataURL(f);
    }

    // إدارة
    function openAdmin() { if(prompt("أدخل كلمة المرور (123):") === sets.pass) document.getElementById('adminPanel').style.display='block'; }

    function addProduct() {
        const n = document.getElementById('pN').value; const p = document.getElementById('pP').value;
        const c = document.getElementById('pC').value; const d = document.getElementById('pD').value;
        if(n && p && tempImages.length > 0) {
            db.ref('items').push({ name: n, price: p, code: c, desc: d, images: tempImages }).then(() => { alert("تمت الإضافة"); location.reload(); });
        }
    }

    function saveSets() {
        let u = { title: document.getElementById('setT').value, wa: document.getElementById('setW').value, pass: document.getElementById('setPass').value };
        if(tempHeader) u.hB = tempHeader; if(tempBody) u.bB = tempBody;
        db.ref('settings').update(u).then(() => alert("تم الحفظ"));
    }

    // المودال
    function openOrder(k) {
        db.ref('items/'+k).once('value', s => {
            activeP = s.val(); vIdx = 0;
            document.getElementById('targetN').innerText = activeP.name;
            document.getElementById('targetC').innerText = "كود: " + (activeP.code || 'N/A');
            document.getElementById('vImg').src = (activeP.images || [activeP.img])[0];
            document.getElementById('modal').style.display = 'block';
            document.getElementById('orderForm').style.display = 'block';
            document.getElementById('invoiceSection').style.display = 'none';
        });
    }

    function moveV(dir) {
        const imgs = activeP.images || [activeP.img];
        vIdx = (vIdx + dir + imgs.length) % imgs.length;
        document.getElementById('vImg').src = imgs[vIdx];
    }

    function confirmOrder() {
        const nS = (sets.lastSerial || 1000) + 1;
        const q = document.getElementById('cuQ').value;
        currentOrder = { name: activeP.name, code: activeP.code || 'N/A', customer: document.getElementById('cuN').value, qty: q, price: activeP.price, total: activeP.price * q, serial: nS };
        db.ref('orders').push({...currentOrder, status: 'new'}); db.ref('settings').update({ lastSerial: nS });
        
        document.getElementById('invShop').innerText = sets.title;
        document.getElementById('invSer').innerText = nS;
        document.getElementById('invItem').innerText = currentOrder.name;
        document.getElementById('invPrice').innerText = currentOrder.price;
        document.getElementById('invQty').innerText = q;
        document.getElementById('invTotal').innerText = currentOrder.total;
        
        document.getElementById('orderForm').style.display = 'none';
        document.getElementById('invoiceSection').style.display = 'block';
    }

    function sendWA() { window.open(`https://wa.me/${sets.wa}?text=طلب رقم ${currentOrder.serial}: ${currentOrder.name}`, '_blank'); }
    function downloadInv() { html2canvas(document.getElementById('invoiceBox')).then(c => { const l = document.createElement('a'); l.download='inv.png'; l.href=c.toDataURL(); l.click(); }); }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }
</script>

</body>
</html>
