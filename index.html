<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khalid Store | المطور</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root { --main: #ff8c00; --dark: #0a0a0c; --card: #16161a; }
        body { font-family: 'Cairo', sans-serif; background: var(--dark); color: white; margin: 0; padding-bottom: 60px; background-size: cover; background-attachment: fixed; }
        
        header { text-align: center; padding: 30px 10px; background: #000; border-bottom: 3px solid var(--main); }
        
        /* شبكة المنتجات (2 جنب بعض) */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
        .card { background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid #222; display: flex; flex-direction: column; cursor: pointer; }
        .card-img { width: 100%; aspect-ratio: 1/1; object-fit: contain; background: #000; }
        .p-info { padding: 8px; text-align: center; }
        .p-price { color: var(--main); font-weight: bold; }

        /* لوحة التحكم الشاملة */
        #adminPanel { display: none; position: fixed; inset: 0; background: #f0f0f0; color: #333; z-index: 99999; overflow-y: auto; padding: 20px; }
        .admin-box { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; border-right: 5px solid var(--main); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .inp { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: 'Cairo'; }
        
        .admin-btn { position: fixed; bottom: 10px; left: 10px; font-size: 11px; color: #555; background: rgba(255,255,255,0.1); border: none; cursor: pointer; z-index: 999; padding: 5px; border-radius: 4px; }

        /* المودال وعارض الصور */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000; overflow-y: auto; padding: 10px; }
        .modal-content { background: #fff; color: #333; padding: 20px; border-radius: 20px; max-width: 500px; margin: 40px auto; position: relative; }
        
        .viewer-box { position: relative; width: 100%; text-align: center; background: #000; border-radius: 10px; overflow: hidden; }
        .viewer-box img { width: 100%; max-height: 350px; object-fit: contain; }
        .v-nav { position: absolute; top: 50%; transform: translateY(-50%); background: var(--main); color: white; border: none; padding: 10px; border-radius: 50%; cursor: pointer; font-size: 18px; z-index: 10; }

        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 5px; font-family: 'Cairo'; }
        .btn-main { background: var(--main); color: white; }
        
        .row-item { background: #eee; padding: 10px; margin-bottom: 5px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-right: 4px solid var(--main); }
    </style>
</head>
<body>

<header id="mainHeader"><h1 id="shopName">Khalid Store</h1></header>
<div id="storeGrid" class="grid"></div>

<button class="admin-btn" onclick="checkPass()">[ Admin ]</button>

<div id="adminPanel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
        <h2 style="margin:0;">🛠 لوحة التحكم</h2>
        <button onclick="document.getElementById('adminPanel').style.display='none'" style="background:red; color:white; border:none; padding:10px 15px; border-radius:8px;">إغلاق</button>
    </div>

    <div class="admin-box">
        <h3>🎨 الإعدادات</h3>
        <input type="text" id="setT" class="inp" placeholder="اسم المتجر">
        <input type="text" id="setW" class="inp" placeholder="رقم الواتساب">
        <label>الغلاف:</label><input type="file" class="inp" onchange="encodeImg('header')">
        <label>الخلفية:</label><input type="file" class="inp" onchange="encodeImg('body')">
        <button class="btn btn-main" onclick="saveSets()">حفظ الإعدادات</button>
    </div>

    <div class="admin-box">
        <h3>📦 إضافة منتج (صور متعددة)</h3>
        <input type="text" id="pN" class="inp" placeholder="اسم المنتج">
        <input type="number" id="pP" class="inp" placeholder="السعر">
        <input type="file" class="inp" multiple onchange="encodeMulti()">
        <button class="btn btn-main" onclick="uploadP()">رفع المنتج</button>
    </div>

    <div class="admin-box"><h3>📥 الطلبات الجديدة</h3><div id="listOrders"></div></div>
    <div class="admin-box"><h3>✅ الأرشيف</h3><div id="listArchive"></div></div>
    <div class="admin-box"><h3>🗒 المخزن</h3><div id="listProds"></div></div>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <div class="viewer-box">
            <button class="v-nav" style="right:10px;" onclick="changeImg(1)">❯</button>
            <img id="vImg" src="">
            <button class="v-nav" style="left:10px;" onclick="changeImg(-1)">❮</button>
        </div>
        <div id="orderForm">
            <h3 id="targetN" style="text-align:center; margin-top:10px;"></h3>
            <input type="text" id="cuN" class="inp" placeholder="الاسم الكامل">
            <input type="text" id="cuP" class="inp" placeholder="رقم الهاتف">
            <input type="number" id="cuQ" class="inp" value="1">
            <button class="btn btn-main" onclick="confirmOrder()">إرسال الطلب</button>
        </div>
        <div id="invoiceSection" style="display:none;">
            <div id="invoiceBox" style="background:#fff; color:#000; padding:15px; border:1px solid #000; direction:ltr;">
                <h2 id="invShop" style="text-align:center;"></h2>
                <hr><p>Order: #<span id="invSer"></span></p>
                <p>Item: <span id="invItem"></span></p>
                <p>Total: <b id="invTotal"></b> AED</p>
            </div>
            <button class="btn btn-main" onclick="downloadInv()">تحميل الفاتورة 📥</button>
            <button class="btn" style="background:#25d366; color:white;" onclick="sendWA()">واتساب 💬</button>
        </div>
        <button class="btn" style="background:#eee; color:#333;" onclick="closeM()">إغلاق</button>
    </div>
</div>

<script>
    // تهيئة Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyD6nEUwZKumRxmYUdqiJISTYsKcy5j_ISM",
        authDomain: "khalid-store-86442.firebaseapp.com",
        databaseURL: "https://khalid-store-86442-default-rtdb.firebaseio.com",
        projectId: "khalid-store-86442",
        storageBucket: "khalid-store-86442.firebasestorage.app",
        messagingSenderId: "857306041339",
        appId: "1:857306041339:web:b5b38da9563fde210d595e"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let sets = {}, tempImgs = [], tempHeader = "", tempBody = "", activeP = null, vIdx = 0, currentOrder = null;

    // جلب البيانات
    db.ref('settings').on('value', s => {
        sets = s.val() || { title: "Khalid Store", wa: "966", lastSerial: 1000 };
        document.getElementById('shopName').innerText = sets.title;
        if(sets.hB) document.getElementById('mainHeader').style.backgroundImage = `url('${sets.hB}')`;
        if(sets.bB) document.body.style.backgroundImage = `url('${sets.bB}')`;
    });

    db.ref('items').on('value', s => {
        const grid = document.getElementById('storeGrid'); const list = document.getElementById('listProds');
        grid.innerHTML = ''; list.innerHTML = ''; const d = s.val();
        if(d) Object.keys(d).forEach(k => {
            const i = d[k]; const imgs = i.images || [i.img];
            grid.innerHTML += `<div class="card" onclick="openM('${k}')"><img src="${imgs[0]}" class="card-img"><div class="p-info"><b>${i.name}</b><br><span class="p-price">${i.price} AED</span></div></div>`;
            list.innerHTML += `<div class="row-item"><span>${i.name}</span><button onclick="db.ref('items/${k}').remove()" style="color:red;border:none;background:none;">حذف</button></div>`;
        });
    });

    db.ref('orders').on('value', s => {
        const l = document.getElementById('listOrders'); const a = document.getElementById('listArchive');
        l.innerHTML = ''; a.innerHTML = ''; const d = s.val();
        if(d) Object.keys(d).forEach(k => {
            const o = d[k]; const h = `<div class="row-item"><span>#${o.serial} - ${o.customer}</span><button onclick="db.ref('orders/${k}').update({status:'archived'})">أرشفة</button></div>`;
            if(o.status === 'new') l.innerHTML += h; else a.innerHTML += h;
        });
    });

    // الوظائف
    function checkPass() { if(prompt("أدخل الباسورد:") === "123") document.getElementById('adminPanel').style.display='block'; else alert("خطأ!"); }
    
    function encodeMulti() {
        const files = event.target.files; tempImgs = [];
        Array.from(files).forEach(f => { const r = new FileReader(); r.onloadend = () => tempImgs.push(r.result); r.readAsDataURL(f); });
    }

    function uploadP() {
        const n = document.getElementById('pN').value, p = document.getElementById('pP').value;
        if(n && p && tempImgs.length > 0) db.ref('items').push({ name: n, price: p, images: tempImgs }).then(() => alert("تمت الإضافة"));
    }

    function saveSets() {
        let u = { title: document.getElementById('setT').value, wa: document.getElementById('setW').value };
        if(tempHeader) u.hB = tempHeader; if(tempBody) u.bB = tempBody;
        db.ref('settings').update(u).then(() => alert("تم الحفظ"));
    }

    function openM(k) {
        db.ref('items/'+k).once('value', s => {
            activeP = s.val(); vIdx = 0;
            document.getElementById('targetN').innerText = activeP.name;
            document.getElementById('vImg').src = (activeP.images || [activeP.img])[0];
            document.getElementById('modal').style.display = 'block';
            document.getElementById('orderForm').style.display = 'block';
            document.getElementById('invoiceSection').style.display = 'none';
        });
    }

    function changeImg(dir) { const imgs = activeP.images || [activeP.img]; vIdx = (vIdx + dir + imgs.length) % imgs.length; document.getElementById('vImg').src = imgs[vIdx]; }

    function confirmOrder() {
        const nS = (sets.lastSerial || 1000) + 1;
        currentOrder = { name: activeP.name, customer: document.getElementById('cuN').value, qty: document.getElementById('cuQ').value, price: activeP.price, serial: nS };
        db.ref('orders').push({...currentOrder, status: 'new'}); db.ref('settings').update({ lastSerial: nS });
        document.getElementById('invShop').innerText = sets.title; document.getElementById('invSer').innerText = nS;
        document.getElementById('invItem').innerText = currentOrder.name; document.getElementById('invTotal').innerText = currentOrder.price * currentOrder.qty;
        document.getElementById('orderForm').style.display = 'none'; document.getElementById('invoiceSection').style.display = 'block';
    }

    function encodeImg(t) { const f = event.target.files[0]; const r = new FileReader(); r.onloadend = () => { if(t==='header') tempHeader = r.result; else tempBody = r.result; }; r.readAsDataURL(f); }
    function downloadInv() { html2canvas(document.getElementById('invoiceBox')).then(c => { const l = document.createElement('a'); l.download='inv.png'; l.href=c.toDataURL(); l.click(); }); }
    function sendWA() { window.open(`https://wa.me/${sets.wa}?text=طلب رقم ${currentOrder.serial}`, '_blank'); }
    function closeM() { document.getElementById('modal').style.display = 'none'; }
</script>
</body>
</html>
