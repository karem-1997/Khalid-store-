<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khalid Store | 3-Column Fast</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root { --main: #ff8c00; --dark: #0a0a0c; }
        body { font-family: 'Cairo', sans-serif; background: var(--dark); color: white; margin: 0; overflow-x: hidden; }
        
        .bg-fix { position: fixed; inset: 0; z-index: -1; background-color: var(--dark); background-size: cover; background-position: center; }
        header { text-align: center; padding: 20px 10px; background: rgba(0,0,0,0.9); border-bottom: 2px solid var(--main); }

        /* تعديل ليكون 3 منتجات في الصف */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; }
        .card { background: #16161a; border-radius: 6px; overflow: hidden; border: 1px solid #222; max-height: 190px; display: flex; flex-direction: column; }
        .img-box { width: 100%; height: 80px; background: #000; cursor: pointer; }
        .img-box img { width: 100%; height: 100%; object-fit: contain; }
        
        .card-info { padding: 2px; text-align: center; }
        .card-info b { font-size: 0.65rem; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-info span { color: var(--main); font-weight: bold; font-size: 0.75rem; }

        .order-btn { background: var(--main); color: white; border: none; padding: 4px; margin: 2px auto; border-radius: 3px; width: 90%; font-size: 0.65rem; cursor: pointer; font-family: 'Cairo'; font-weight: bold; }

        /* لوحة التحكم */
        #adminPanel { display: none; position: fixed; inset: 0; background: #f4f4f4; color: #333; z-index: 9999; overflow-y: auto; padding: 15px; }
        .admin-box { background: white; padding: 10px; border-radius: 8px; margin-bottom: 10px; border-right: 4px solid var(--main); }
        .inp { width: 100%; padding: 8px; margin: 4px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-family: 'Cairo'; }

        /* النوافذ */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; overflow-y: auto; }
        .modal-content { background: #fff; color: #333; padding: 15px; border-radius: 12px; max-width: 380px; margin: 15px auto; text-align: center; position: relative; }
        
        .slider-box { position: relative; width: 100%; height: 240px; background: #000; border-radius: 8px; overflow: hidden; }
        .slider-box img { width: 100%; height: 100%; object-fit: contain; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: var(--main); color: white; border: none; padding: 10px; cursor: pointer; border-radius: 50%; z-index: 10; }

        /* زر الأدمن الواضح */
        .admin-trigger { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.3); padding: 8px 20px; border-radius: 20px; font-size: 13px; cursor: pointer; transition: 0.3s; margin: 20px 0; }
        .admin-trigger:hover { background: var(--main); border-color: var(--main); }

        /* الفاتورة المنبثقة للأدمن */
        #invoicePopup { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 10001; padding: 15px; }
        .popup-content { background: white; max-width: 350px; margin: auto; padding: 15px; border-radius: 10px; position: relative; color: #000; }
        .close-popup { position: absolute; top: -10px; left: -10px; background: #ff4444; color: white; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; border: 2px solid #fff; font-weight: bold; }
    </style>
</head>
<body>

<div id="bodyBg" class="bg-fix"></div>

<header id="mainHeader"><h1 id="shopName" style="margin:0; font-size:1.2rem;">Store</h1></header>

<div id="storeGrid" class="grid"></div>

<div style="text-align:center; padding: 20px;">
    <button onclick="openAdmin()" class="admin-trigger">⚙️ Admin Control الإدارة</button>
</div>

<div id="adminPanel">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>🛠 لوحة الإدارة</h3>
        <button onclick="document.getElementById('adminPanel').style.display='none'" style="background:#000; color:#fff; border:none; padding:5px 10px; border-radius:5px;">إغلاق</button>
    </div>
    <div class="admin-box">
        <h4>🎨 الإعدادات</h4>
        <input type="text" id="setT" class="inp" placeholder="اسم المتجر">
        <input type="text" id="setWA" class="inp" placeholder="واتساب">
        <input type="text" id="setPass" class="inp" placeholder="باسورد الإدارة">
        <button class="inp" style="background:var(--main); color:white" onclick="saveSets()">حفظ الإعدادات</button>
    </div>
    <div class="admin-box">
        <h4>📦 إضافة منتج</h4>
        <input type="text" id="pN" class="inp" placeholder="الاسم">
        <textarea id="pDesc" class="inp" placeholder="الوصف"></textarea>
        <input type="number" id="pP" class="inp" placeholder="السعر">
        <input type="file" id="mFiles" class="inp" multiple onchange="encodeMulti()">
        <button class="inp" style="background:var(--main); color:white" onclick="upload()">نشر المنتج</button>
    </div>
    <div class="admin-box"><h4>📥 الطلبات</h4><div id="listOrders"></div></div>
    <div class="admin-box"><h4>🗒 المنتجات</h4><div id="listProds"></div></div>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <div class="slider-box">
            <button class="nav-btn" style="right:5px;" onclick="changeImg(1)">❯</button>
            <img id="vImg" src="">
            <button class="nav-btn" style="left:5px;" onclick="changeImg(-1)">❮</button>
        </div>
        <h3 id="mTitle" style="margin:10px 0 0 0;"></h3>
        <p id="mDesc" style="font-size:0.8rem; color:#666;"></p>
        <h3 id="mPrice" style="color:var(--main); margin:10px 0;"></h3>
        <input type="text" id="cuN" class="inp" placeholder="اسمك">
        <input type="text" id="cuP" class="inp" placeholder="رقم الموبايل">
        <button class="inp" style="background:var(--main); color:white; font-weight:bold" onclick="sendOrder()">تأكيد الطلب 🛒</button>
        <button class="inp" onclick="document.getElementById('modal').style.display='none'">إلغاء</button>
    </div>
</div>

<div id="invoicePopup">
    <div class="popup-content">
        <button class="close-popup" onclick="document.getElementById('invoicePopup').style.display='none'">X</button>
        <div id="printArea" style="text-align:right; border:1px solid #ddd; padding:10px;">
            <h3 id="iShop" style="text-align:center; color:var(--main);"></h3>
            <p><b>رقم الطلب:</b> #<span id="iSer"></span></p>
            <p><b>العميل:</b> <span id="iCu"></span></p>
            <p><b>المنتج:</b> <span id="iItem"></span></p>
            <h3 style="background:#eee; text-align:center; padding:5px;">الإجمالي: <span id="iTotal"></span> AED</h3>
        </div>
        <button class="inp" style="background:var(--main); color:white" onclick="downloadOrder()">حفظ كصورة 📥</button>
        <a id="waFinal" href="#" target="_blank" style="text-decoration:none;"><button class="inp" style="background:#25d366; color:white">إرسال واتساب 💬</button></a>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD6nEUwZKumRxmYUdqiJISTYsKcy5j_ISM",
        authDomain: "khalid-store-86442.firebaseapp.com",
        databaseURL: "https://khalid-store-86442-default-rtdb.firebaseio.com",
        projectId: "khalid-store-86442",
        storageBucket: "khalid-store-86442.firebasestorage.app",
        messagingSenderId: "857306041339",
        appId: "1:857306041339:web:b5b38da9563fde210d595e"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let sets = {}, tempImgs = [], activeItem = null, vIdx = 0;

    db.ref('settings').on('value', s => {
        sets = s.val() || { title: "Store", pass: "123" };
        document.getElementById('shopName').innerText = sets.title;
        if(sets.bB) document.getElementById('bodyBg').style.backgroundImage = `url('${sets.bB}')`;
        document.getElementById('setT').value = sets.title;
        document.getElementById('setWA').value = sets.wa || "";
        document.getElementById('setPass').value = sets.pass;
    });

    db.ref('items').on('value', s => {
        const grid = document.getElementById('storeGrid'); const list = document.getElementById('listProds');
        grid.innerHTML = ''; list.innerHTML = ''; const d = s.val();
        if(d) Object.keys(d).forEach(k => {
            const i = d[k];
            grid.innerHTML += `<div class="card">
                <div class="img-box" onclick="openItem('${k}')"><img src="${i.images[0]}" loading="lazy"></div>
                <div class="card-info" onclick="openItem('${k}')"><b>${i.name}</b><span>${i.price} AED</span></div>
                <button class="order-btn" onclick="openItem('${k}')">طلب</button>
            </div>`;
            list.innerHTML += `<div style="font-size:0.8rem; border-bottom:1px solid #ddd; padding:5px;">${i.name} <button onclick="db.ref('items/${k}').remove()" style="color:red; float:left;">حذف</button></div>`;
        });
    });

    db.ref('orders').on('value', s => {
        const l = document.getElementById('listOrders'); l.innerHTML = ''; const d = s.val();
        if(d) Object.keys(d).forEach(k => {
            l.innerHTML += `<div style="font-size:0.8rem; border-bottom:1px solid #ddd; padding:5px;">#${d[k].serial} - ${d[k].customer} <button onclick="showFinal('${k}')">فاتورة</button> <button onclick="db.ref('orders/${k}').remove()" style="color:red; float:left;">X</button></div>`;
        });
    });

    function openAdmin() {
        let p = prompt("باسورد الإدارة:");
        if(p === (sets.pass || "123")) document.getElementById('adminPanel').style.display='block';
        else alert("خطأ!");
    }

    function saveSets() {
        const up = { title: document.getElementById('setT').value, wa: document.getElementById('setWA').value, pass: document.getElementById('setPass').value };
        db.ref('settings').update(up).then(() => alert("تم الحفظ"));
    }

    function openItem(k) {
        db.ref('items/'+k).once('value', s => {
            activeItem = s.val(); vIdx = 0;
            document.getElementById('mTitle').innerText = activeItem.name;
            document.getElementById('mDesc').innerText = activeItem.desc || "";
            document.getElementById('mPrice').innerText = activeItem.price + " AED";
            document.getElementById('vImg').src = activeItem.images[0];
            document.getElementById('modal').style.display = 'block';
        });
    }

    function changeImg(dir) {
        vIdx = (vIdx + dir + activeItem.images.length) % activeItem.images.length;
        document.getElementById('vImg').src = activeItem.images[vIdx];
    }

    function sendOrder() {
        const n = document.getElementById('cuN').value, p = document.getElementById('cuP').value;
        if(!n || !p) return alert("اكمل البيانات");
        const sn = (sets.lastSerial || 1000) + 1;
        const o = { name: activeItem.name, customer: n, price: activeItem.price, serial: sn };
        const ref = db.ref('orders').push(o);
        db.ref('settings').update({ lastSerial: sn });
        showFinal(ref.key); document.getElementById('modal').style.display = 'none';
    }

    function showFinal(k) {
        db.ref('orders/'+k).once('value', s => {
            const o = s.val();
            document.getElementById('iShop').innerText = sets.title;
            document.getElementById('iSer').innerText = o.serial;
            document.getElementById('iCu').innerText = o.customer;
            document.getElementById('iItem').innerText = o.name;
            document.getElementById('iTotal').innerText = o.price;
            document.getElementById('waFinal').href = `https://wa.me/${sets.wa}?text=تأكيد طلب رقم #${o.serial} لمنتج ${o.name}`;
            document.getElementById('invoicePopup').style.display = 'block';
        });
    }

    function encodeMulti() {
        const f = document.getElementById('mFiles').files; tempImgs = [];
        Array.from(f).forEach(file => {
            const r = new FileReader();
            r.onloadend = () => tempImgs.push(r.result);
            r.readAsDataURL(file);
        });
    }

    function upload() {
        const n = document.getElementById('pN').value, p = document.getElementById('pP').value, dsc = document.getElementById('pDesc').value;
        if(n && p && tempImgs.length > 0) {
            db.ref('items').push({ name: n, price: p, desc: dsc, images: tempImgs }).then(() => location.reload());
        } else { alert("اكمل بيانات المنتج"); }
    }

    function downloadOrder() {
        html2canvas(document.getElementById('printArea')).then(c => {
            const l = document.createElement('a'); l.download='order.png'; l.href=c.toDataURL(); l.click();
        });
    }
</script>
</body>
</html>
