<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khalid Store | Dashboard Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root { --main: #ff8c00; --dark: #0a0a0c; --card: #16161a; }
        body { font-family: 'Cairo', sans-serif; background: var(--dark); color: white; margin: 0; padding-bottom: 60px; background-size: cover; background-attachment: fixed; }
        
        header { text-align: center; padding: 40px 10px; background: #000; border-bottom: 3px solid var(--main); background-size: cover; background-position: center; }
        .about-text { padding: 10px; font-size: 0.9rem; color: #ccc; text-align: center; max-width: 600px; margin: auto; }
        
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
        .card { background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid #222; cursor: pointer; position: relative; }
        .img-container { width: 100%; aspect-ratio: 1/1; background: #000; overflow: hidden; }
        .card-img { width: 100%; height: 100%; object-fit: contain; }

        /* لوحة التحكم */
        #adminPanel { display: none; position: fixed; inset: 0; background: #f0f2f5; color: #333; z-index: 9999; overflow-y: auto; padding: 20px; }
        .admin-box { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; border-right: 5px solid var(--main); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .inp { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-family: 'Cairo'; box-sizing: border-box; }
        
        /* الفاتورة */
        #invoiceOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100000; padding: 20px; overflow-y: auto; }
        .invoice-card { background: white; color: black; max-width: 450px; margin: auto; padding: 25px; border-radius: 15px; position: relative; }
        .close-x { position: absolute; top: 10px; left: 10px; background: #ff4444; color: white; border: none; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; font-size: 20px; }

        .social-bar { display: flex; justify-content: center; gap: 20px; padding: 15px; background: rgba(0,0,0,0.5); }
        .social-bar a { color: white; font-size: 24px; transition: 0.3s; }
        .social-bar a:hover { color: var(--main); }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; overflow-y: auto; padding: 10px; }
        .modal-content { background: #fff; color: #333; padding: 20px; border-radius: 20px; max-width: 500px; margin: 20px auto; }
        .v-box { position: relative; width: 100%; background: #000; border-radius: 15px; overflow: hidden; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: var(--main); color: white; border: none; padding: 12px; cursor: pointer; border-radius: 50%; z-index: 5; }

        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; font-family: 'Cairo'; }
        .btn-main { background: var(--main); color: white; }
        .discount-tag { position: absolute; top: 10px; right: 10px; background: red; color: white; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>

<header id="mainHeader">
    <h1 id="shopName">Khalid Store</h1>
    <div id="shopAbout" class="about-text"></div>
</header>

<div class="social-bar">
    <a id="linkWA" href="#" target="_blank"><i class="fab fa-whatsapp"></i></a>
    <a id="linkIG" href="#" target="_blank"><i class="fab fa-instagram"></i></a>
    <a id="linkFB" href="#" target="_blank"><i class="fab fa-facebook"></i></a>
</div>

<div id="storeGrid" class="grid"></div>

<button style="position:fixed; bottom:10px; left:10px; opacity:0.1; border:none; background:none; color:white; font-size:10px;" onclick="checkAdmin()">Admin</button>

<div id="adminPanel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 style="margin:0;">⚙️ إعدادات المتجر الشاملة</h2>
        <button onclick="document.getElementById('adminPanel').style.display='none'" class="btn" style="width:auto; background:#333; color:white; margin:0;">إغلاق</button>
    </div>

    <div class="admin-box">
        <h3>🎨 الهوية والتصميم</h3>
        <input type="text" id="setT" class="inp" placeholder="اسم المتجر">
        <textarea id="setAb" class="inp" placeholder="نبذة عن المتجر"></textarea>
        <label>صورة الغلاف (Header):</label><input type="file" class="inp" onchange="encodeFile('hB')">
        <label>خلفية الموقع (Background):</label><input type="file" class="inp" onchange="encodeFile('bB')">
    </div>

    <div class="admin-box">
        <h3>🔗 روابط التواصل الاجتماعي</h3>
        <input type="text" id="setWA" class="inp" placeholder="رقم الواتساب (مثال: 9665xxx)">
        <input type="text" id="setIG" class="inp" placeholder="رابط إنستغرام">
        <input type="text" id="setFB" class="inp" placeholder="رابط فيسبوك">
    </div>

    <div class="admin-box">
        <h3>🔒 الأمان</h3>
        <input type="text" id="setPass" class="inp" placeholder="تغيير كلمة مرور الإدارة">
        <button class="btn btn-main" onclick="saveSettings()">حفظ كافة الإعدادات</button>
    </div>

    <div class="admin-box">
        <h3>📦 إضافة منتج جديد</h3>
        <input type="text" id="pN" class="inp" placeholder="اسم المنتج">
        <input type="text" id="pC" class="inp" placeholder="كود المنتج">
        <textarea id="pD" class="inp" placeholder="وصف المنتج"></textarea>
        <input type="number" id="pP" class="inp" placeholder="السعر">
        <input type="number" id="pDisc" class="inp" placeholder="خصم %">
        <input type="file" class="inp" multiple onchange="encodeMulti()">
        <button class="btn btn-main" onclick="uploadProduct()">رفع المنتج</button>
    </div>

    <div class="admin-box"><h3>📥 الطلبات</h3><div id="listOrders"></div></div>
    <div class="admin-box"><h3>✅ الأرشيف</h3><div id="listArchive"></div></div>
    <div class="admin-box"><h3>🗒 المنتجات</h3><div id="listProds"></div></div>
</div>

<div id="invoiceOverlay">
    <div class="invoice-card">
        <button class="close-x" onclick="document.getElementById('invoiceOverlay').style.display='none'">×</button>
        <div id="invoicePrint" style="direction:ltr; font-family:monospace; padding:10px; border:1px solid #eee;">
            <h2 style="text-align:center; border-bottom:2px solid #000;" id="iShop"></h2>
            <p style="text-align:center; font-size:10px;">TAX INVOICE / فاتورة ضريبية</p>
            <p><b>No:</b> #<span id="iSer"></span> | <b>Date:</b> <span id="iDate"></span></p>
            <p><b>Customer:</b> <span id="iCu"></span></p>
            <p><b>Phone:</b> <span id="iPh"></span></p>
            <hr>
            <p><b>Product:</b> <span id="iItem"></span></p>
            <p><b>Qty:</b> <span id="iQty"></span></p>
            <hr>
            <p>Subtotal: <span id="iSub"></span> AED</p>
            <p>VAT (5%): <span id="iVat"></span> AED</p>
            <h3 style="text-align:right; border-top:1px solid #000; padding-top:5px;">TOTAL: <span id="iTotal"></span> AED</h3>
        </div>
        <button class="btn btn-main" onclick="downloadInvoice()">تحميل كصورة 📥</button>
    </div>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <div class="v-box">
            <button class="nav-btn" style="right:10px;" onclick="changeImg(1)">❯</button>
            <img id="vImg" style="width:100%; height:350px; object-fit:contain;">
            <button class="nav-btn" style="left:10px;" onclick="changeImg(-1)">❮</button>
        </div>
        <div id="mInfo" style="margin-top:15px;">
            <h2 id="mTitle" style="margin:0;"></h2>
            <p id="mDesc" style="color:#666; font-size:0.9rem;"></p>
            <p id="mCode" style="color:var(--main); font-weight:bold;"></p>
            <div id="mPriceArea"></div>
            <hr>
            <input type="text" id="cuN" class="inp" placeholder="اسمك الكريم">
            <input type="text" id="cuP" class="inp" placeholder="رقم هاتفك">
            <input type="number" id="cuQ" class="inp" value="1">
            <button class="btn btn-main" onclick="sendOrder()">تأكيد الطلب</button>
        </div>
        <button class="btn" style="background:#eee;" onclick="document.getElementById('modal').style.display='none'">رجوع</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD6nEUwZKumRxmYUdqiJISTYsKcy5j_ISM",
        authDomain: "khalid-store-86442.firebaseapp.com",
        databaseURL: "https://khalid-store-86442-default-rtdb.firebaseio.com",
        projectId: "khalid-store-86442",
        storageBucket: "khalid-store-86442.firebasestorage.app",
        messagingSenderId: "857306041339",
        appId: "1:857306041339:web:b5b38da9563fde210d595e"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let sets = {}, tempImgs = [], vIdx = 0, activeP = null, hB = "", bB = "";

    // جلب الإعدادات
    db.ref('settings').on('value', s => {
        sets = s.val() || { title: "Khalid Store", pass: "123", lastSerial: 1000 };
        document.getElementById('shopName').innerText = sets.title;
        document.getElementById('shopAbout').innerText = sets.about || "";
        if(sets.hB) document.getElementById('mainHeader').style.backgroundImage = `url('${sets.hB}')`;
        if(sets.bB) document.body.style.backgroundImage = `url('${sets.bB}')`;
        
        document.getElementById('linkWA').href = `https://wa.me/${sets.wa || ''}`;
        document.getElementById('linkIG').href = sets.ig || "#";
        document.getElementById('linkFB').href = sets.fb || "#";

        // تعبئة الحقول في اللوحة
        document.getElementById('setT').value = sets.title;
        document.getElementById('setAb').value = sets.about || "";
        document.getElementById('setWA').value = sets.wa || "";
        document.getElementById('setIG').value = sets.ig || "";
        document.getElementById('setFB').value = sets.fb || "";
        document.getElementById('setPass').value = sets.pass;
    });

    // جلب المنتجات
    db.ref('items').on('value', s => {
        const grid = document.getElementById('storeGrid'); const list = document.getElementById('listProds');
        grid.innerHTML = ''; list.innerHTML = ''; const d = s.val();
        if(d) Object.keys(d).forEach(k => {
            const i = d[k]; const hasD = i.discount > 0;
            const price = hasD ? (i.price - (i.price * i.discount / 100)) : i.price;
            grid.innerHTML += `
                <div class="card" onclick="openProduct('${k}')">
                    <div class="img-container">
                        ${hasD ? `<div class="discount-tag">-${i.discount}%</div>` : ''}
                        <img src="${i.images[0]}" class="card-img">
                    </div>
                    <div style="padding:10px; text-align:center;">
                        <b>${i.name}</b><br>
                        <span style="color:var(--main); font-weight:900;">${price} AED</span>
                    </div>
                </div>`;
            list.innerHTML += `<div class="row-item">${i.name} <button onclick="db.ref('items/${k}').remove()" style="color:red; float:left; border:none; background:none;">حذف</button></div>`;
        });
    });

    // جلب الطلبات
    db.ref('orders').on('value', s => {
        const l = document.getElementById('listOrders'); const a = document.getElementById('listArchive');
        l.innerHTML = ''; a.innerHTML = ''; const d = s.val();
        if(d) Object.keys(d).forEach(k => {
            const o = d[k];
            const h = `<div class="row-item"><b>#${o.serial} - ${o.customer}</b><br>
                <button onclick="viewInvoice('${k}')">👁 الفاتورة</button>
                ${o.status=='new'?`<button onclick="db.ref('orders/${k}').update({status:'arc'})">أرشفة</button>`:`<button onclick="db.ref('orders/${k}').remove()">مسح</button>`}
            </div>`;
            o.status=='new' ? l.innerHTML += h : a.innerHTML += h;
        });
    });

    function checkAdmin() { if(prompt("Pass:") === (sets.pass || "123")) document.getElementById('adminPanel').style.display='block'; }

    function saveSettings() {
        const u = {
            title: document.getElementById('setT').value,
            about: document.getElementById('setAb').value,
            wa: document.getElementById('setWA').value,
            ig: document.getElementById('setIG').value,
            fb: document.getElementById('setFB').value,
            pass: document.getElementById('setPass').value
        };
        if(hB) u.hB = hB; if(bB) u.bB = bB;
        db.ref('settings').update(u).then(() => alert("تم حفظ الإعدادات بنجاح"));
    }

    function openProduct(k) {
        db.ref('items/'+k).once('value', s => {
            activeP = s.val(); vIdx = 0;
            document.getElementById('mTitle').innerText = activeP.name;
            document.getElementById('mDesc').innerText = activeP.desc || '';
            document.getElementById('mCode').innerText = "كود: " + (activeP.code || '---');
            document.getElementById('vImg').src = activeP.images[0];
            document.getElementById('modal').style.display = 'block';
        });
    }

    function changeImg(dir) { vIdx = (vIdx + dir + activeP.images.length) % activeP.images.length; document.getElementById('vImg').src = activeP.images[vIdx]; }

    function sendOrder() {
        const q = document.getElementById('cuQ').value;
        const p = activeP.discount > 0 ? (activeP.price - (activeP.price * activeP.discount / 100)) : activeP.price;
        const sub = p * q; const vat = (sub * 0.05).toFixed(2);
        const sn = (sets.lastSerial || 1000) + 1;
        const order = {
            name: activeP.name, customer: document.getElementById('cuN').value,
            phone: document.getElementById('cuP').value, qty: q, price: p,
            sub: sub, vat: vat, total: (parseFloat(sub) + parseFloat(vat)).toFixed(2),
            serial: sn, date: new Date().toLocaleString(), status: 'new'
        };
        db.ref('orders').push(order); db.ref('settings').update({ lastSerial: sn });
        alert("شكراً لك! تم استلام طلبك"); document.getElementById('modal').style.display='none';
    }

    function viewInvoice(k) {
        db.ref('orders/'+k).once('value', s => {
            const o = s.val();
            document.getElementById('iShop').innerText = sets.title;
            document.getElementById('iSer').innerText = o.serial;
            document.getElementById('iDate').innerText = o.date;
            document.getElementById('iCu').innerText = o.customer;
            document.getElementById('iPh').innerText = o.phone;
            document.getElementById('iItem').innerText = o.name;
            document.getElementById('iQty').innerText = o.qty;
            document.getElementById('iSub').innerText = o.sub;
            document.getElementById('iVat').innerText = o.vat;
            document.getElementById('iTotal').innerText = o.total;
            document.getElementById('invoiceOverlay').style.display = 'block';
        });
    }

    function encodeFile(type) {
        const file = event.target.files[0]; const reader = new FileReader();
        reader.onloadend = () => { if(type==='hB') hB = reader.result; else bB = reader.result; };
        reader.readAsDataURL(file);
    }

    function encodeMulti() {
        const files = event.target.files; tempImgs = [];
        Array.from(files).forEach(f => {
            const r = new FileReader(); r.onloadend = () => tempImgs.push(r.result); r.readAsDataURL(f);
        });
    }

    function uploadProduct() {
        const n = document.getElementById('pN').value, p = document.getElementById('pP').value,
              c = document.getElementById('pC').value, d = document.getElementById('pD').value,
              ds = document.getElementById('pDisc').value || 0;
        if(n && p && tempImgs.length > 0) {
            db.ref('items').push({ name: n, price: p, code: c, desc: d, discount: ds, images: tempImgs })
            .then(() => { alert("تم رفع المنتج"); location.reload(); });
        }
    }

    function downloadInvoice() {
        html2canvas(document.getElementById('invoicePrint')).then(c => {
            const l = document.createElement('a'); l.download='invoice.png'; l.href=c.toDataURL(); l.click();
        });
    }
</script>
</body>
</html>
