<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khalid Store | المتجر المتكامل</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root { --main: #ff8c00; --dark: #0a0a0c; --card: #16161a; }
        body { font-family: 'Cairo', sans-serif; background: var(--dark); color: white; margin: 0; padding-bottom: 60px; }
        
        header { text-align: center; padding: 30px 10px; background: #000; border-bottom: 3px solid var(--main); background-size: cover; background-position: center; }
        
        /* شبكة المنتجات (2 جنب بعض) */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 10px; }
        .card { background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid #222; display: flex; flex-direction: column; cursor: pointer; }
        .card-img { width: 100%; aspect-ratio: 1/1; object-fit: contain; background: #000; }

        /* لوحة التحكم الشاملة - تظهر فوق كل شيء */
        #adminPanel { 
            display: none; position: fixed; inset: 0; 
            background: #f0f0f0; color: #333; z-index: 99999; 
            overflow-y: auto; padding: 20px; 
        }
        .admin-box { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; border-right: 5px solid var(--main); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .inp { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: 'Cairo'; }
        
        /* زر أدمن الصغير */
        .admin-btn { position: fixed; bottom: 10px; left: 10px; font-size: 12px; color: #555; background: none; border: none; cursor: pointer; z-index: 9999; }

        /* المودال */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000; overflow-y: auto; padding: 10px; }
        .modal-content { background: #fff; color: #333; padding: 20px; border-radius: 20px; max-width: 500px; margin: 40px auto; }
        
        .viewer-box { position: relative; width: 100%; text-align: center; background: #000; border-radius: 10px; overflow: hidden; }
        .viewer-box img { width: 100%; max-height: 350px; object-fit: contain; }
        .v-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,140,0,0.8); color: white; border: none; padding: 10px; border-radius: 50%; cursor: pointer; font-size: 18px; }

        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 5px; font-family: 'Cairo'; }
        .btn-main { background: var(--main); color: white; }
        
        .order-row { background: #eee; padding: 10px; margin-bottom: 5px; border-radius: 8px; border-right: 3px solid var(--main); }
    </style>
</head>
<body>

<header id="mainHeader">
    <h1 id="shopName">Khalid Store</h1>
</header>

<div id="storeGrid" class="grid"></div>

<button class="admin-btn" onclick="openAdminPortal()">[ Admin ]</button>

<div id="adminPanel">
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 2px solid #ddd; padding-bottom: 10px; margin-bottom: 20px;">
        <h2 style="margin:0;">🛠 لوحة تحكم خالد ستور</h2>
        <button onclick="closeAdminPortal()" style="background:red; color:white; border:none; padding:10px 15px; border-radius:8px; cursor:pointer;">إغلاق</button>
    </div>

    <div class="admin-box">
        <h3>🎨 إعدادات المتجر</h3>
        <input type="text" id="setT" class="inp" placeholder="اسم المتجر">
        <input type="text" id="setW" class="inp" placeholder="رقم الواتساب">
        <label>صورة الغلاف (Header):</label><input type="file" class="inp" onchange="encodeCover('header')">
        <label>خلفية المتجر (Body):</label><input type="file" class="inp" onchange="encodeCover('body')">
        <input type="text" id="setPass" class="inp" placeholder="تغيير كلمة السر">
        <button class="btn btn-main" onclick="saveSettings()">حفظ الإعدادات</button>
    </div>

    <div class="admin-box">
        <h3>📦 إضافة منتج (صور متعددة)</h3>
        <input type="text" id="pN" class="inp" placeholder="اسم المنتج">
        <input type="text" id="pC" class="inp" placeholder="كود المنتج">
        <input type="number" id="pP" class="inp" placeholder="السعر">
        <textarea id="pD" class="inp" placeholder="وصف المنتج"></textarea>
        <label>اختر الصور (حتى 6 صور):</label>
        <input type="file" id="pI" class="inp" multiple onchange="encodeMultiImgs()">
        <div id="previews" style="display:flex; gap:5px; margin-top:10px;"></div>
        <button class="btn btn-main" onclick="uploadProduct()">إضافة للمتجر</button>
    </div>

    <div class="admin-box"><h3>📥 طلبات بانتظار التجهيز</h3><div id="listOrders"></div></div>
    <div class="admin-box"><h3>✅ الأرشيف</h3><div id="listArchive"></div></div>
    <div class="admin-box"><h3>🗒 إدارة المنتجات</h3><div id="listProds"></div></div>
</div>

<div id="modal" class="modal">
    <div class="modal-content">
        <div class="viewer-box">
            <button class="v-nav" style="right:10px;" onclick="moveImg(1)">❯</button>
            <img id="vImg" src="">
            <button class="v-nav" style="left:10px;" onclick="moveImg(-1)">❮</button>
        </div>
        <div id="orderForm">
            <h3 id="targetN" style="text-align:center; margin:10px 0 0 0;"></h3>
            <p id="targetC" style="text-align:center; color:#888; margin-bottom:10px;"></p>
            <input type="text" id="cuN" class="inp" placeholder="اسمك الكريم">
            <input type="text" id="cuP" class="inp" placeholder="رقم الموبايل">
            <input type="number" id="cuQ" class="inp" value="1" placeholder="الكمية">
            <button class="btn btn-main" onclick="processOrder()">اطلب الآن</button>
        </div>
        <div id="invoiceSection" style="display:none;">
            <div id="invoiceBox" style="background:#fff; color:#000; padding:15px; border:1px solid #000; direction:ltr;">
                <h2 id="invShop" style="text-align:center;"></h2>
                <hr>
                <p>Order ID: #<span id="invSer"></span></p>
                <p>Item: <span id="invItem"></span></p>
                <p>Total: <b id="invTotal"></b> AED</p>
            </div>
            <button class="btn btn-main" onclick="downloadInvoice()">حفظ الفاتورة 📥</button>
            <button class="btn" style="background:#25d366; color:white;" onclick="sendWhatsApp()">واتساب 💬</button>
        </div>
        <button class="btn" style="background:#eee; margin-top:10px; color:#555;" onclick="closeOrderModal()">إغلاق</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD6nEUwZKumRxmYUdqiJISTYsKcy5j_ISM",
        authDomain: "khalid-store-86442.firebaseapp.com",
        databaseURL: "https://khalid-store-86442-default-rtdb.firebaseio.com",
        projectId: "khalid-store-86442",
        storageBucket: "khalid-store-86442.firebasestorage.app",
        messagingSenderId: "857306041339",
        appId: "1:857306041339:web:b5b38da9563fde210d595e"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let sets = {}, tempImages = [], tempHeader = "", tempBody = "", activeP = null, vIdx = 0, currentOrder = null;

    // جلب البيانات
    db.ref('settings').on('value', s => {
        sets = s.val() || { title: "Khalid Store", wa: "966", pass: "123", lastSerial: 1000 };
        document.getElementById('shopName').innerText = sets.title;
        if(sets.hB) document.getElementById('mainHeader').style.backgroundImage = `url('${sets.hB}')`;
        if(sets.bB) document.body.style.backgroundImage = `url('${sets.bB}')`;
        document.getElementById('setT').value = sets.title;
        document.getElementById('setW').value = sets.wa;
        document.getElementById('setPass').value = sets.pass;
    });

    db.ref('items').on('value', s => {
        const grid = document.getElementById('storeGrid');
        const list = document.getElementById('listProds');
        grid.innerHTML = ''; list.innerHTML = '';
        const data = s.val();
        if(data) Object.keys(data).forEach(k => {
            const i = data[k]; const imgs = i.images || [i.img];
            grid.innerHTML += `<div class="card" onclick="openOrderModal('${k}')"><img src="${imgs[0]}" class="card-img"><div style="padding:10px; text-align:center;"><b>${i.name}</b><br><span style="color:var(--main)">${i.price} AED</span></div></div>`;
            list.innerHTML += `<div class="order-row" style="display:flex; justify-content:space-between;"><span>${i.name}</span><button onclick="deleteItem('${k}')" style="color:red; background:none; border:none; cursor:pointer;">حذف</button></div>`;
        });
    });

    db.ref('orders').on('value', s => {
        const l = document.getElementById('listOrders'); const a = document.getElementById('listArchive');
        l.innerHTML = ''; a.innerHTML = ''; const d = s.val();
        if(d) Object.keys(d).forEach(k => {
            const o = d[k];
            const h = `<div class="order-row"><b>#${o.serial} - ${o.customer}</b><br>${o.name}<br><button onclick="archiveOrder('${k}')">أرشفة</button></div>`;
            if(o.status === 'new') l.innerHTML += h; else a.innerHTML += h;
        });
    });

    // وظائف الأدمن
    function openAdminPortal() {
        const p = prompt("أدخل كلمة المرور:");
        if(p === sets.pass) {
            document.getElementById('adminPanel').style.display = 'block';
        } else {
            alert("كلمة مرور خاطئة!");
        }
    }

    function closeAdminPortal() { document.getElementById('adminPanel').style.display = 'none'; }

    function encodeMultiImgs() {
        const files = event.target.files; tempImages = []; document.getElementById('previews').innerHTML = '';
        Array.from(files).forEach(f => {
            const r = new FileReader(); r.onloadend = () => { tempImages.push(r.result); document.getElementById('previews').innerHTML += `<img src="${r.result}" style="width:30px; height:30px; border-radius:4px;">`; }; r.readAsDataURL(f);
        });
    }

    function uploadProduct() {
        const n = document.getElementById('pN').value, p = document.getElementById('pP').value, c = document.getElementById('pC').value;
        if(n && p && tempImages.length > 0) {
            db.ref('items').push({ name: n, price: p, code: c, images: tempImages }).then(() => { alert("تمت الإضافة"); location.reload(); });
        }
    }

    function saveSettings() {
        let u = { title: document.getElementById('setT').value, wa: document.getElementById('setW').value, pass: document.getElementById('setPass').value };
        if(tempHeader) u.hB = tempHeader; if(tempBody) u.bB = tempBody;
        db.ref('settings').update(u).then(() => alert("تم حفظ الإعدادات بنجاح"));
    }

    // وظائف المتجر
    function openOrderModal(k) {
        db.ref('items/'+k).once('value', s => {
            activeP = s.val(); vIdx = 0;
            document.getElementById('targetN').innerText = activeP.name;
            document.getElementById('targetC').innerText = "كود: " + (activeP.code || 'N/A');
            document.getElementById('vImg').src = (activeP.images || [activeP.img])[0];
            document.getElementById('modal').style.display = 'block';
            document.getElementById('orderForm').style.display = 'block';
            document.getElementById('invoiceSection').style.display = 'none';
        });
    }

    function moveImg(dir) {
        const imgs = activeP.images || [activeP.img];
        vIdx = (vIdx + dir + imgs.length) % imgs.length;
        document.getElementById('vImg').src = imgs[vIdx];
    }

    function processOrder() {
        const nS = (sets.lastSerial || 1000) + 1;
        currentOrder = { name: activeP.name, customer: document.getElementById('cuN').value, qty: document.getElementById('cuQ').value, price: activeP.price, serial: nS };
        db.ref('orders').push({...currentOrder, status: 'new'});
        db.ref('settings').update({ lastSerial: nS });
        
        document.getElementById('invShop').innerText = sets.title;
        document.getElementById('invSer').innerText = nS;
        document.getElementById('invItem').innerText = currentOrder.name;
        document.getElementById('invTotal').innerText = currentOrder.price * currentOrder.qty;
        document.getElementById('orderForm').style.display = 'none';
        document.getElementById('invoiceSection').style.display = 'block';
    }

    function deleteItem(k) { if(confirm("هل أنت متأكد من الحذف؟")) db.ref('items/'+k).remove(); }
    function archiveOrder(k) { db.ref('orders/'+k).update({status:'archived'}); }
    function closeOrderModal() { document.getElementById('modal').style.display = 'none'; }
    function encodeCover(t) { const f = event.target.files[0]; const r = new FileReader(); r.onloadend = () => { if(t==='header') tempHeader = r.result; else tempBody = r.result; }; r.readAsDataURL(f); }
    function downloadInvoice() { html2canvas(document.getElementById('invoiceBox')).then(c => { const l = document.createElement('a'); l.download='invoice.png'; l.href=c.toDataURL(); l.click(); }); }
    function sendWhatsApp() { window.open(`https://wa.me/${sets.wa}?text=طلب رقم ${currentOrder.serial}: ${currentOrder.name}`, '_blank'); }
</script>

</body>
</html>
