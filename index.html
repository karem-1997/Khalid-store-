<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khalid Store | عرض احترافي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root { --main: #ff8c00; --dark: #0a0a0c; --card: #16161a; }
        body { 
            font-family: 'Cairo', sans-serif; background: var(--dark); color: white; margin: 0; 
            background-attachment: fixed; background-size: cover;
        }
        
        header { text-align: center; padding: 40px 10px; background: #000; border-bottom: 3px solid var(--main); background-size: cover; }
        
        /* شبكة المنتجات - 2 في كل صف */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; padding: 12px; 
        }
        
        .card { 
            background: var(--card); border-radius: 12px; overflow: hidden; 
            border: 1px solid #222; display: flex; flex-direction: column;
        }

        .card-img-box { width: 100%; aspect-ratio: 1/1; position: relative; cursor: pointer; }
        .card-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .img-count { 
            position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.7);
            padding: 2px 8px; border-radius: 10px; font-size: 0.7rem;
        }

        .card-info { padding: 10px; text-align: center; }
        .card-info h4 { margin: 5px 0; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .price { color: var(--main); font-weight: bold; font-size: 1rem; }

        .btn-buy { 
            background: #25d366; color: white; border: none; width: 90%; 
            padding: 8px; margin: 10px auto; border-radius: 8px; font-weight: bold;
            font-family: 'Cairo'; cursor: pointer; font-size: 0.85rem;
        }

        /* نافذة عرض الصور (Lightbox) */
        #viewer { 
            display: none; position: fixed; inset: 0; background: #000; 
            z-index: 30000; flex-direction: column; align-items: center; justify-content: center;
        }
        .viewer-content { position: relative; width: 100%; height: 70vh; display: flex; align-items: center; }
        .viewer-content img { width: 100%; max-height: 100%; object-fit: contain; }
        .v-btn { 
            position: absolute; top: 50%; transform: translateY(-50%); 
            background: rgba(255,255,255,0.2); border: none; color: white; 
            padding: 15px; cursor: pointer; border-radius: 50%;
        }
        .v-next { left: 10px; } .v-prev { right: 10px; }
        .close-v { position: absolute; top: 20px; right: 20px; font-size: 2rem; color: white; cursor: pointer; }

        /* Admin */
        #adminPanel { display: none; position: fixed; inset: 0; background: #fff; color: #000; z-index: 40000; overflow-y: auto; padding: 20px; }
        .inp { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }

        @media (min-width: 768px) { .grid { grid-template-columns: repeat(4, 1fr); } }
    </style>
</head>
<body id="mainBody">

<header id="mainHeader">
    <h1 id="shopName" style="color:var(--main); margin:0;">Khalid Store</h1>
</header>

<div id="storeGrid" class="grid"></div>

<div id="viewer">
    <span class="close-v" onclick="closeViewer()">&times;</span>
    <div class="viewer-content">
        <button class="v-btn v-next" onclick="moveV(1)">❮</button>
        <img id="vImg" src="">
        <button class="v-btn v-prev" onclick="moveV(-1)">❯</button>
    </div>
    <div id="vCounter" style="margin-top:20px; font-size:1.2rem;"></div>
</div>

<div id="adminPanel">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2>⚙️ إعدادات المتجر</h2>
        <button onclick="document.getElementById('adminPanel').style.display='none'">إغلاق</button>
    </div>
    <div style="background:#f4f4f4; padding:15px; border-radius:10px;">
        <input type="text" id="setT" class="inp" placeholder="اسم المتجر">
        <input type="text" id="setW" class="inp" placeholder="رقم الواتساب">
        <label>صورة الغلاف:</label><input type="file" onchange="encodeCover('header')">
        <button class="btn-buy" style="background:var(--main)" onclick="saveSets()">حفظ الإعدادات</button>
    </div>
    <hr>
    <h3>إضافة منتج جديد (أكثر من صورة)</h3>
    <input type="text" id="pN" class="inp" placeholder="اسم المنتج">
    <input type="text" id="pC" class="inp" placeholder="كود المنتج">
    <input type="number" id="pP" class="inp" placeholder="السعر">
    <input type="file" id="pI" class="inp" multiple onchange="encodeImages()">
    <button class="btn-buy" onclick="saveProduct()">رفع المنتج للمتجر</button>
    <div id="adminProds"></div>
</div>

<footer style="text-align:center; padding:30px; opacity:0.1;"><button onclick="checkAdmin()">Admin</button></footer>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD6nEUwZKumRxmYUdqiJISTYsKcy5j_ISM",
        authDomain: "khalid-store-86442.firebaseapp.com",
        databaseURL: "https://khalid-store-86442-default-rtdb.firebaseio.com",
        projectId: "khalid-store-86442",
        storageBucket: "khalid-store-86442.firebasestorage.app",
        messagingSenderId: "857306041339",
        appId: "1:857306041339:web:b5b38da9563fde210d595e"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let sets = {}, tempImages = [], currentVImgs = [], vIdx = 0, tempHeader = "";

    // جلب الإعدادات والمنتجات
    db.ref('settings').on('value', s => {
        sets = s.val() || { title: "Khalid Store", wa: "966", pass: "123" };
        document.getElementById('shopName').innerText = sets.title;
        if(sets.hB) document.getElementById('mainHeader').style.backgroundImage = `url('${sets.hB}')`;
    });

    db.ref('items').on('value', s => {
        const grid = document.getElementById('storeGrid');
        grid.innerHTML = '';
        const data = s.val();
        if(data) Object.keys(data).forEach(k => {
            const i = data[k];
            const imgs = i.images || [i.img];
            grid.innerHTML += `
                <div class="card">
                    <div class="card-img-box" onclick="openViewer('${encodeURIComponent(JSON.stringify(imgs))}')">
                        <img src="${imgs[0]}">
                        <div class="img-count"><i class="far fa-images"></i> ${imgs.length}</div>
                    </div>
                    <div class="card-info">
                        <h4>${i.name}</h4>
                        <div class="price">${i.price} AED</div>
                    </div>
                    <button class="btn-buy" onclick="sendWA('${i.name}','${i.code}')">طلب الآن</button>
                </div>
            `;
        });
    });

    // نظام عرض الصور (Lightbox)
    function openViewer(dataStr) {
        currentVImgs = JSON.parse(decodeURIComponent(dataStr));
        vIdx = 0;
        updateV();
        document.getElementById('viewer').style.display = 'flex';
    }

    function updateV() {
        document.getElementById('vImg').src = currentVImgs[vIdx];
        document.getElementById('vCounter').innerText = `${vIdx + 1} / ${currentVImgs.length}`;
    }

    function moveV(dir) {
        vIdx = (vIdx + dir + currentVImgs.length) % currentVImgs.length;
        updateV();
    }

    function closeViewer() { document.getElementById('viewer').style.display = 'none'; }

    // وظائف الإدارة
    function encodeImages() {
        const files = event.target.files;
        tempImages = [];
        Array.from(files).forEach(f => {
            const r = new FileReader();
            r.onloadend = () => tempImages.push(r.result);
            r.readAsDataURL(f);
        });
    }

    function encodeCover(t) {
        const f = event.target.files[0];
        const r = new FileReader();
        r.onloadend = () => { tempHeader = r.result; };
        r.readAsDataURL(f);
    }

    function saveProduct() {
        const name = document.getElementById('pN').value;
        const price = document.getElementById('pP').value;
        const code = document.getElementById('pC').value;
        if(name && price && tempImages.length > 0) {
            db.ref('items').push({ name, price, code, images: tempImages });
            alert("تمت الإضافة");
            location.reload();
        }
    }

    function saveSets() {
        let u = { title: document.getElementById('setT').value, wa: document.getElementById('setW').value };
        if(tempHeader) u.hB = tempHeader;
        db.ref('settings').update(u).then(() => alert("تم الحفظ"));
    }

    function sendWA(name, code) {
        const msg = `مرحباً، أريد طلب منتج من Khalid Store:%0Aالاسم: ${name}%0Aالكود: ${code || 'N/A'}`;
        window.open(`https://wa.me/${sets.wa}?text=${msg}`, '_blank');
    }

    function checkAdmin() {
        if(prompt("Pass:") === sets.pass) document.getElementById('adminPanel').style.display='block';
    }
</script>

</body>
</html>
